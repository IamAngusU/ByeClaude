name: ByeClaude attribution guard
description: Fail CI when reachable fetched history contains Co-Authored-By attribution matching the active rule set.
author: Angus Uelsmann

inputs:
  rules-file:
    description: Optional repository-relative structured attribution rules JSON. Empty uses the built-in Claude/Anthropic rule.
    required: false
    default: ''
  include-remotes:
    description: Also scan fetched remote-tracking refs.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
    - name: Check Git history
      shell: bash
      env:
        BYECLAUDE_INCLUDE_REMOTES: ${{ inputs.include-remotes }}
        BYECLAUDE_RULES_FILE: ${{ inputs.rules-file }}
      run: |
        args=()
        if [ "$BYECLAUDE_INCLUDE_REMOTES" = "true" ]; then
          args+=(--include-remotes)
        fi
        if [ -n "$BYECLAUDE_RULES_FILE" ]; then
          case "$BYECLAUDE_RULES_FILE" in
            /*) rules="$BYECLAUDE_RULES_FILE" ;;
            *) rules="$GITHUB_WORKSPACE/$BYECLAUDE_RULES_FILE" ;;
          esac
          args+=(--rules "$rules")
        fi
        cd "$GITHUB_ACTION_PATH"
        go run ./cmd/byeclaude check "${args[@]}" --repo "$GITHUB_WORKSPACE"

branding:
  icon: git-branch
  color: gray-dark
