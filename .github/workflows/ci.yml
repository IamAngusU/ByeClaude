name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Toolchain
        run: |
          git --version
          go version
      - name: Formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Module integrity
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Fixture suite
        run: scripts/verify-fixture-suite.sh
      - name: Attribution guard
        run: go run ./cmd/byeclaude check --include-remotes
      - name: Build
        run: go build -trimpath ./cmd/byeclaude
      - name: Demo image
        run: docker build -f deploy/demo/Dockerfile .

  platform:
    name: Tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Toolchain
        run: |
          git --version
          go version
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build -trimpath ./cmd/byeclaude
