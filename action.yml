name: ByeClaude attribution guard
description: Fail CI when reachable fetched history contains declared attribution matching the active rule set.
author: Angus Uelsmann

inputs:
  rules-file:
    description: Optional repository-relative structured attribution rules JSON. Empty uses the built-in Claude/Anthropic rule.
    required: false
    default: ''
  include-remotes:
    description: Also scan fetched remote-tracking refs.
    required: false
    default: 'true'
  include-identities:
    description: Also reject Git author and committer identities matching the active rules.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Verify release binary and check full Git history
      shell: bash
      env:
        BYECLAUDE_INCLUDE_REMOTES: ${{ inputs.include-remotes }}
        BYECLAUDE_RULES_FILE: ${{ inputs.rules-file }}
        BYECLAUDE_INCLUDE_IDENTITIES: ${{ inputs.include-identities }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-action.sh"

branding:
  icon: git-branch
  color: gray-dark
